<main class="variants"></main><p class="footer">这是独立设计预览，使用虚构食材与日期，不读取或修改应用数据。点击“添加食材”可查看表单配色；沿用仓库基础配色；暖金输入框边界、轻阴影、主次分区、加强警示和展开营养为新增设计。营养数字仅为排版示例，未验证手机已安装旧版。本次不修改正式应用。</p>
<script>
const paths={plus:'M12 5v14M5 12h14',search:'M21 21l-5-5M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0',camera:'M4 7h4l2-3h4l2 3h4v13H4z M16 13a4 4 0 1 1-8 0 4 4 0 0 1 8 0',fridge:'M5 3h14v19H5z M5 10h14M8 6v2M8 13v4',calendar:'M4 5h16v16H4z M8 3v4M16 3v4M4 10h16M8 14h2M14 14h2M8 18h2',book:'M12 5c-3-2-7-2-10 0v15c3-2 7-2 10 0 3-2 7-2 10 0V5c-3-2-7-2-10 0z M12 5v15',basket:'M3 9h18l-2 12H5z M7 9l3-6M17 9l-3-6M9 13v4M15 13v4',food:'M5 3v7c0 3 6 3 6 0V3M8 3v19M18 3c-3 4-3 9 0 10h2V3h-2z M20 13v9',arrow:'M9 5l7 7-7 7',alert:'M12 3L2 21h20z M12 9v5M12 17v1'};
const icon=n=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]}"/></svg>`;
const themes=[['fusion','A','冰箱列表','紧凑 · 清晰','#f9cc4f'],['fusion','B','五餐菜单','同屏 · 有序','#f9cc4f'],['fusion','C','添加食材','简洁 · 统一','#f9cc4f']];
const items=[['鲜牛奶','乳品','1 瓶','过期·勿食用','danger','expired'],['西兰花','蔬菜','300 g','临期·剩1天','warning','soon'],['小番茄','蔬菜','500 g','剩余 4 天','','fresh'],['鸡蛋','蛋类','6 个','剩余 8 天','','fresh'],['胡萝卜','蔬菜','2 根','剩余 5 天','','fresh'],['鸡胸肉','肉类','400 g','剩余 3 天','','fresh']];
const meals=[['早餐',['鸡蛋三明治','燕麦牛奶']],['午餐',['番茄炒蛋','清炒西兰花','杂粮饭']],['下午茶',['水果酸奶']],['晚餐',['香煎鸡胸肉','蒜蓉生菜','南瓜粥']],['夜宵',['银耳羹']]];
let view='all';
function fridge(){return `<label class="search">${icon('search')}<input aria-label="搜索冰箱食材" placeholder="搜索冰箱里的食材"/></label><div class="summary"><strong>新鲜有数，好好吃饭</strong><small>共 6 批食材</small></div><button class="camera">${icon('camera')}<span><strong>拍照识别</strong><small>拍下食材，核对后放入冰箱</small></span><span class="arrow">${icon('arrow')}</span></button><div class="chips" aria-label="食材分类">${['全部','蔬菜','肉类','蛋奶'].map((x,i)=>`<button class="${i===0?'active':''}" data-filter="${x}">${x}</button>`).join('')}</div><div class="list stock">${items.map(([name,cat,qty,status,cls,badge])=>`<div class="row ${cls}" data-category="${cat}"><span class="name">${name}</span><span class="cat">${cat}</span><span class="qty">${qty}</span><span class="badge ${badge}">${status}</span></div>`).join('')}</div><div class="notice">${icon('alert')}<span><strong>1 批已过期，请勿食用</strong><small>及时清理；另有 1 批临期，请尽快食用。</small></span></div><p class="note">期限仅作参考，请以包装标示和实际状态为准。</p>`}
function week(){return `<div class="week-title"><span>9 月 21 日 — 27 日</span><span style="font-size:12px;color:var(--accent-ink)">一周总览 ›</span></div><div class="days">${['一','二','三','四','五','六','日'].map((x,i)=>`<div class="day ${i===0?'on':''}">周${x}<b>${21+i}</b></div>`).join('')}</div><div class="summary"><strong>一饭一饮 三餐四季</strong><small>10 道菜</small></div><div class="list">${meals.map(([name,dishes])=>`<div class="meal"><span class="meal-name">${name}</span><div class="dishes">${dishes.map(x=>`<span class="dish">${x}<small>×1</small></span>`).join('')}</div></div>`).join('')}</div><section class="nutrition" aria-label="当日预计营养"><div class="nutrition-head"><strong>当日预计营养</strong><span>示例数据</span></div><div class="nutrient-grid"><div><small>能量</small><b>1,860 <em>kcal</em></b></div><div><small>蛋白质</small><b>92 <em>g</em></b></div><div><small>脂肪</small><b>58 <em>g</em></b></div><div><small>碳水化合物</small><b>243 <em>g</em></b></div><div><small>膳食纤维</small><b>26 <em>g</em></b></div><div class="nutrition-caption">菜单预计营养<br>非实际摄入</div></div><p class="estimate-note">仅为布局示例，未根据上方菜品计算。</p></section>`}
function render(){document.querySelector('.variants').innerHTML=themes.map(([cls,id,name,desc,color])=>{const view=window.previewMode || (id === 'B' ? 'week' : 'fridge');return `<section class="variant ${cls}" aria-label="${name}"><div class="variant-title"><b>${id}</b><h2>${name}</h2><span>${desc}</span></div><div class="phone"><div class="status"><span>9:41</span><svg viewBox="0 0 43 15" aria-hidden="true"><path d="M1 12V9M5 12V6M9 12V3M16 5q5-5 10 0M19 8q2-2 4 0" fill="none" stroke="currentColor" stroke-width="2"/><rect x="30" y="3" width="10" height="8" rx="2" fill="none" stroke="currentColor"/><path d="M32 5h6v4h-6zM41 5v4" fill="currentColor"/></svg></div><div class="app-head"><div><div class="sub">食光 · 我的厨房</div><h3>${view==='fridge'?'我的冰箱':'本周菜单'}</h3></div><button class="add">${icon('plus')}${view==='fridge'?'添加食材':'安排菜品'}</button></div><div class="screen">${view==='fridge'?fridge():week()}</div><nav class="bottom" aria-label="应用导航">${[['food','点单'],['fridge','冰箱'],['basket','菜篮子'],['calendar','周菜单'],['book','菜谱']].map(([i,n])=>`<button data-tab="${i}" class="${(view==='fridge'&&i==='fridge')||(view==='week'&&i==='calendar')?'selected':''}"><span class="nav-icon">${icon(i)}</span>${n}</button>`).join('')}</nav></div><div class="palette"><span class="swatch" style="background:var(--brand)"></span><span class="swatch" style="background:var(--bg)"></span><span class="swatch" style="background:${color}"></span><span class="swatch" style="background:var(--accent)"></span><span>品牌 / 背景 / 操作 / 辅助</span></div></section>`}).join('');document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));if(view==='all')showSheet(document.querySelectorAll('.phone')[2]);}
function showSheet(phone){const veil=document.createElement('div');veil.className='veil';veil.innerHTML=`<section class="sheet" role="dialog" aria-label="添加食材预览"><div class="sheet-head"><h4>添加食材</h4><button class="close" aria-label="关闭">✕</button></div><form><div class="fields"><label class="wide">食材名称<input value="西兰花"></label><label>数量<input type="number" value="300"></label><label>单位<select><option>克 g</option><option>个</option></select></label><label>分类<select><option>蔬菜</option><option>肉类</option></select></label><label>保存方式<select><option>冷藏</option><option>冷冻</option></select></label><label>入库日期<input type="date" value="2026-09-21"></label><label>参考保存天数<input type="number" placeholder="待估算"></label></div><p class="note">配色预览，不计算保存期或写入真实库存。</p><button class="add save" type="submit">确认放入冰箱</button></form></section>`;phone.append(veil);veil.querySelector('.close').onclick=()=>veil.remove();veil.addEventListener('click',e=>{if(e.target===veil)veil.remove()});veil.querySelector('form').onsubmit=e=>{e.preventDefault();veil.remove();feedback(phone,'预览操作完成，未保存真实数据。')};veil.querySelector('input').focus()}
function feedback(phone,text){phone.querySelector('.feedback')?.remove();const p=document.createElement('p');p.className='feedback';p.setAttribute('role','status');p.textContent=text;phone.querySelector('.screen').prepend(p)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;window.previewMode=view==='all'?null:view;render();return}const phone=b.closest('.phone');if(!phone)return;if(b.matches('.app-head .add')){if(phone.querySelector('h3').textContent.includes('冰箱'))showSheet(phone);else feedback(phone,'此预览展示已安排的 10 道菜；餐次编辑将在正式版本提供。')}if(b.classList.contains('camera'))feedback(phone,'这是配色预览，不会打开相机或发送图片。');if(b.dataset.tab){if(['fridge','calendar'].includes(b.dataset.tab)){view=b.dataset.tab==='fridge'?'fridge':'week';window.previewMode=view;render()}else feedback(phone,'本次仅预览冰箱、五餐菜单与添加食材面板。')}if(b.dataset.filter){phone.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));phone.querySelectorAll('.row').forEach(r=>r.classList.toggle('hidden',!(b.dataset.filter==='全部'||b.dataset.filter===r.dataset.category||(b.dataset.filter==='蛋奶'&&['蛋类','乳品'].includes(r.dataset.category)))||!r.querySelector('.name').textContent.includes(phone.querySelector('.search input').value.trim())));}});
document.addEventListener('input',e=>{if(!e.target.matches('.search input'))return;const phone=e.target.closest('.phone');const query=e.target.value.trim();phone.querySelectorAll('.row').forEach(r=>{const filter=phone.querySelector('[data-filter].active')?.dataset.filter;const matchesCategory=filter==='全部'||filter===r.dataset.category||(filter==='蛋奶'&&['蛋类','乳品'].includes(r.dataset.category));r.classList.toggle('hidden',!matchesCategory||!r.querySelector('.name').textContent.includes(query))});});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.veil').forEach(x=>x.remove())});render();
</script></html>
